[project]
name = "luyan-erp"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.120.4",
  "uvicorn==0.38.0",
  "SQLAlchemy==2.0.44",
  "psycopg[binary]==3.2.12",
  "httpx==0.28.1",
  "python-dotenv==1.2.2",
  "PyJWT==2.10.1"
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python scripts/cloud_bootstrap.py"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
